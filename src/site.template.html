<!DOCTYPE html>
<html lang="en" data-initial-view="{{INITIAL_VIEW}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="author" content="{{AUTHOR_NAME}}">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
<meta name="theme-color" content="#F7F2E9">
<link rel="canonical" href="{{CANONICAL_URL}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:locale" content="{{LOCALE}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:image" content="{{SOCIAL_IMAGE_URL}}">
<meta property="og:image:secure_url" content="{{SOCIAL_IMAGE_URL}}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="{{SOCIAL_IMAGE_WIDTH}}">
<meta property="og:image:height" content="{{SOCIAL_IMAGE_HEIGHT}}">
<meta property="og:image:alt" content="{{SOCIAL_IMAGE_ALT}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{SOCIAL_IMAGE_URL}}">
<meta name="twitter:image:alt" content="{{SOCIAL_IMAGE_ALT}}">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<script type="application/ld+json">{{STRUCTURED_DATA}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css?v={{ASSET_VERSION}}">
</head>
<body>
{{PUBLIC_CONTENT}}
<script src="/assets/site.js?v={{ASSET_VERSION}}" defer></script>
</body>
</html>
